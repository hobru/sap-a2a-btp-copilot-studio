id: get-sales-order-details
name: Get sales order details
description: >-
  Return header details of a single sales order from the SAP GWSAMPLE_BASIC demo service,
  identified by its sales order number. Includes the customer, net / tax / gross amounts,
  currency, lifecycle status description and the free-text note. Use this to answer "what
  is the total of sales order 0500000000?" or "give me the details of order 0500000001".
domain: sales
tags: [sales, sales-order, order, header, amount, status, gwsample, odata, read]
examples:
  - "Show the details of sales order 0500000000."
  - "What is the gross amount and status of order 0500000001?"
  - "Give me the note on sales order 0500000002."

params:
  - name: salesOrderId
    type: string
    required: true
    description: Sales order number, e.g. "0500000000".

backend:
  namespace: IWBEP
  service: GWSAMPLE_BASIC
  entitySet: SalesOrderSet
  operation: getByKey
  key:
    - { field: SalesOrderID, param: salesOrderId }
  select:
    - SalesOrderID
    - CustomerID
    - CustomerName
    - NetAmount
    - TaxAmount
    - GrossAmount
    - CurrencyCode
    - LifecycleStatusDescription
    - Note
